[project]
name = "pixel-life"
version = "0.1.0"
description = "Conway's Game of Life in a window, built on the life package."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "life",
    "pygame-ce>=2.5.8",
]

[project.scripts]
pixel-life = "pixel_life.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
life = { path = "../06-life", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    # Pygame grumbles about this when tests run without a real display.
    "ignore:no fast renderer available",
]
