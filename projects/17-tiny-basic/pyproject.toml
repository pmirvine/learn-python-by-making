[project]
name = "tiny-basic"
version = "0.1.0"
description = "A small BASIC, in the manner of the BBC Micro's."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
basic = "tiny_basic.repl:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
