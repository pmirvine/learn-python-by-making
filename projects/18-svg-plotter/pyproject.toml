[project]
name = "plotter"
version = "0.1.0"
description = "MOVE and DRAW for the browser: a pen plotter that draws SVG."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gallery = "plotter.gallery:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
