[project]
name = "teleview"
version = "0.1.0"
description = "PyFax in the terminal: a teletext viewer, with Textual."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyfax",
    "textual>=8,<9",
]

[project.scripts]
teleview = "teleview.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
pyfax = { path = "../19-pyfax", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.16.8",
    "textual-dev>=1.8.0",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
