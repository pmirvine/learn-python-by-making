[project]
name = "dashboard"
version = "0.1.0"
description = "How your projects are getting on: a dashboard in the terminal, with Rich."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
dashboard = "dashboard.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
