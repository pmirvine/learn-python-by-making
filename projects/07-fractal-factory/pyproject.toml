[project]
name = "fractals"
version = "0.1.0"
description = "Fractal Factory: the Mandelbrot set and friends, as PNG files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
fractal = "fractals.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
