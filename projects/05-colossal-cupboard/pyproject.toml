[project]
name = "cupboard"
version = "0.1.0"
description = "The Colossal Cupboard: a small text adventure."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
cupboard = "cupboard:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
