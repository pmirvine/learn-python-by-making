[project]
name = "sprite-editor"
version = "0.1.0"
description = "A sprite editor, with tools, undo and redo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
sprite-editor = "sprite_editor.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    # Pygame grumbles about this when tests run without a real display.
    "ignore:no fast renderer available",
]
