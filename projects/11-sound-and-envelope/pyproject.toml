[project]
name = "beeb"
version = "0.2.0"
description = "BBC Micro-style graphics and sound commands, built on Pygame."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
beeb = "beeb:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    # Pygame grumbles about this when tests run without a real display.
    "ignore:no fast renderer available",
]

# Not part of a reader's project. In this repository the noisy Breakout lives in
# a folder inside this one, and it's linted from its own folder, as a project apart.
[tool.ruff]
extend-exclude = ["noisy-breakout"]
