[project]
name = "snake"
version = "0.1.0"
description = "Snake, in Pygame."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
snake = "snake.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    # Pygame grumbles about this when tests run without a real display.
    "ignore:no fast renderer available",
]

# Not part of a reader's project. The bug hunt's planted bug is one that ruff
# can see, and the chapter asks the reader to find that out for themselves.
[tool.ruff.lint.per-file-ignores]
"bughunt/duel.py" = ["RUF012"]
