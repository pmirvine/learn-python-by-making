[project]
name = "pyfax"
version = "0.1.0"
description = "A teletext-style site generator: forty columns, eight colours, and graphics made of six squares."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
]

[project.scripts]
pyfax = "pyfax.build:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
