[project]
name = "snake-online"
version = "0.1.0"
description = "Snake, which tells a server how you did."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pygame-ce>=2.5.8",
    "snake",
]

[project.scripts]
snake-online = "snake_online.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
snake = { path = "../../09-snake", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
    # Pygame grumbles about this when tests run without a real display.
    "ignore:no fast renderer available",
]

# Not part of a reader's project. In this repository this project sits inside
# another one, and without a table of its own, ruff would borrow its parent's.
[tool.ruff]
src = ["src"]
