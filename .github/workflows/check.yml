name: Check

# Every push is checked on Linux and Windows. macOS is added when the workflow
# is run by hand (Actions → Check → Run workflow): macOS minutes are billed at
# ten times the rate on a private repository, and the author works on a Mac, so
# that platform is checked locally before every commit. Once the repository is
# public, put macos-latest in the first list too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check everything (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
          || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Lints and tests every project in its own environment, checks the
      # chapters' listings, REPL sessions and Predict answers, and builds the site.
      - run: uv run scripts/check_all.py
