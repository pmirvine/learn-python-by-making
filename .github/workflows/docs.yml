name: Publish the site

# Builds the tutorial and publishes it to GitHub Pages.
#
# Manual only for now: GitHub Pages isn't available for a private repository
# on the free plan. When the repository goes public:
#   1. set the Pages source to "GitHub Actions" (Settings → Pages);
#   2. set site_url in zensical.toml;
#   3. add a `push: branches: [main]` trigger below.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
